name: Feature request
description: Propose a new feature or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve? One or two sentences.
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: Tasks
      description: What would need to change? Bulleted list of concrete steps.
      placeholder: |
        - Add ...
        - Update ...
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How do we know it's done?
      placeholder: |
        - nvsonar ... produces ...
        - Output is ...
    validations:
      required: true
